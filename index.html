<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>マスマティック・ザ・ギャザリング</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&family=Zen+Old+Mincho:wght@500;700&display=swap">
  <style>
    /* よみこみちゅうの しるし（js/ui/loading.js）。ゲームの CSS より さきに 出すので ここに 書く。
       transform だけ うごかす（かるい・JS が いそがしくても とまらない） */
    .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 48px 0; font-weight: 700; }
    .ld-mark { display: flex; gap: 6px; }
    .ld-mark span { width: 26px; height: 34px; border-radius: 5px; display: grid; place-items: center; font-family: var(--display, sans-serif); font-size: 16px; background: var(--paper, #f7f2e3); color: var(--paper-ink, #1f2433); border-top: 5px solid var(--W, #e7d9ad); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); animation: ld-hop 1.2s ease-in-out infinite; }
    .ld-mark span:nth-child(2) { border-top-color: var(--U, #5f9fe2); animation-delay: 0.15s; }
    .ld-mark span:nth-child(3) { border-top-color: var(--G, #4fae6b); animation-delay: 0.3s; }
    .ld-mark span:nth-child(4) { border-top-color: var(--R, #e0624a); animation-delay: 0.45s; }
    @keyframes ld-hop { 0%, 50%, 100% { transform: translateY(0); } 25% { transform: translateY(-30%); } }
    @media (prefers-reduced-motion: reduce) { .ld-mark span { animation: none; } } /* うごきを へらす せってい：とまった まま 字だけ（style.css と おなじ） */
    /* サーバーを まって いる あいだ（がめんの 上に 小さく） */
    #busy { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); z-index: 50; padding: 8px 16px; border-radius: 999px; background: rgba(5, 8, 18, 0.85); color: #eef1f8; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); pointer-events: none; white-space: nowrap; }
    #busy .loading { flex-direction: row; gap: 10px; padding: 0; font-size: 13px; }
    #busy .ld-mark { gap: 4px; }
    #busy .ld-mark span { width: 18px; height: 24px; font-size: 12px; border-top-width: 3px; }
  </style>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"><main class="title"><div class="loading" role="status"><span class="ld-mark" aria-hidden="true"><span>＋</span><span>−</span><span>×</span><span>÷</span></span><span>よみこみちゅう</span></div></main></div>
  <div id="sheet" hidden></div>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
